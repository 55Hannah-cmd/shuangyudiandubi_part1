<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>第一回 LP</title>
    <style>
      :root {
        --page-width: 430px;
        --panel: #fff9f1;
        --cta: #d3a548;
      }

      * { box-sizing: border-box; }

      html { background: #eee8df; scroll-behavior: smooth; }

      body {
        margin: 0;
        background: #fff;
        color: #28231e;
        font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      }

      main {
        width: min(100%, var(--page-width));
        height: 100svh;
        margin: 0 auto;
        background: #fff;
        overflow: hidden;
        cursor: pointer;
        position: relative;
      }

      .lp-page {
        height: 100%;
        display: grid;
        grid-template-rows: 82fr 18fr;
        background: #fff;
        opacity: 1;
        transition: opacity 180ms ease;
      }

      .lp-page:not(.is-active) { display: none; }

      .image-block {
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fff;
      }

      .image-block img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 8px 16px;
      }

      .text-block {
        min-height: 0;
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 4px;
        padding: 8px 10.5% 10px;
        background: var(--panel);
      }

      /* These two empty areas are intentionally reserved for the copy and CTA supplied later. */
      .copy-slot {
        min-height: 1px;
        display: grid;
        place-content: center;
        text-align: center;
      }

      .copy-slot p {
        margin: 0;
        font-size: clamp(13px, 3.8vw, 18px);
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: .02em;
        white-space: nowrap;
      }

      .cta-slot {
        height: clamp(46px, 6.2svh, 58px);
        border: 0;
        border-radius: 15px;
        background: var(--cta);
        color: #fff;
        font: inherit;
        font-size: clamp(17px, 4.5vw, 22px);
        font-weight: 700;
        cursor: default;
      }

      .cta-slot:focus-visible {
        outline: 3px solid #3d3020;
        outline-offset: 3px;
      }

      .pager {
        position: absolute;
        right: 8px;
        bottom: 8px;
        z-index: 2;
        display: flex;
        gap: 5px;
        cursor: default;
      }

      .pager[hidden] { display: none; }

      .pager button {
        width: 32px;
        height: 32px;
        border: 1px solid #b98d3e;
        border-radius: 50%;
        background: #fffdf9;
        color: #7d5a23;
        font-size: 21px;
        line-height: 1;
        cursor: pointer;
      }

      .pager button:focus-visible {
        outline: 3px solid #3d3020;
        outline-offset: 3px;
      }

      .pager button[hidden] { display: none; }

      main .lp-page:not(:first-child) .p4-text-block {
        display: block;
        padding: 0;
        overflow: hidden;
      }

      .p4-outro {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .p4-message,
      .p4-ctas {
        position: absolute;
        inset: 0;
        transition: transform 420ms ease, opacity 320ms ease;
      }

      .p4-message {
        padding: 8px 10.5% 10px;
      }

      .p4-ctas {
        display: grid;
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 6px;
        padding: 8px 48px 10px 12px;
        opacity: 0;
        pointer-events: none;
        transform: translateX(105%);
      }

      .p4-text-block.is-cta-visible .p4-message {
        opacity: 0;
        transform: translateX(-105%);
      }

      .p4-text-block.is-cta-visible .p4-ctas {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(0);
      }

      .p4-cta {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        border-radius: 999px;
        background: #f2bc54;
        color: #2e2519;
        font-size: clamp(15px, 4vw, 20px);
        font-weight: 700;
        line-height: 1.15;
        text-align: center;
        text-decoration: none;
      }

      .p4-cta:focus-visible {
        outline: 3px solid #3d3020;
        outline-offset: 3px;
      }

      .p4-cta--line { padding-inline: 50px 20px; }

      .p4-cta--line img {
        position: absolute;
        left: 8px;
        width: 40px;
        height: 40px;
        object-fit: contain;
      }

      @media (prefers-reduced-motion: reduce) {
        .p4-message,
        .p4-ctas { transition: none; }
      }

      @media (min-width: 431px) {
        body { padding-block: 20px; }
        main { height: min(100svh - 40px, 900px); }
      }
    </style>
  </head>
  <body>
    <main aria-label="第一回 LP">
      <section class="lp-page is-active" aria-label="第一回・1ページ目">
        <div class="image-block"><img src="assets/P1_da.png" alt="第一回 P1" /></div>
        <div class="text-block">
          <div class="copy-slot"><p>最近，什麼都想自己試試看。<br>那媽媽想給他看的呢？</p></div>
          <button class="cta-slot" type="button" aria-label="看看結果">看看結果</button>
        </div>
      </section>
      <section class="lp-page" aria-label="第一回・2ページ目">
        <div class="image-block"><img src="assets/P2_da.png" alt="第一回 P2" /></div>
        <div class="text-block">
          <div class="copy-slot"><p>什麼都想碰……<br>怎麼想給他看的，他偏偏不看？<br>是真的沒興趣嗎？</p></div>
        </div>
      </section>
      <section class="lp-page" aria-label="第一回・3ページ目">
        <div class="image-block"><img src="assets/P3_da.png" alt="第一回 P3" /></div>
        <div class="text-block">
          <div class="copy-slot"><p>原來，他不是不想看。<br>他只是想自己摸摸看、試試看。<br>那下次，他又看別的地方呢？</p></div>
        </div>
      </section>
      <section class="lp-page" aria-label="第一回・4ページ目">
        <div class="image-block"><img src="assets/P4_da.png" alt="第一回 P4" /></div>
        <div class="text-block p4-text-block">
          <div class="p4-outro">
            <div class="copy-slot p4-message"><p>不用急著叫他看這裡。<br>他看到哪裡，妳就陪他看到哪裡。<br>今天，這樣就很好。</p></div>
            <div class="p4-ctas" aria-label="延伸選項">
              <a class="p4-cta p4-cta--line" href="https://line.me/R/ti/p/@pby4339u" target="_blank" rel="noopener"><img src="assets/qiaohu-line.png" alt="" />請巧虎客服幫我找好康</a>
              <a class="p4-cta" href="https://store.benesse.com.tw/products/%E5%B7%A7%E8%99%8E%E9%9B%99%E8%AA%9E%E9%BB%9E%E8%AE%80%E5%9C%96%E9%91%91?utm_source=line&amp;utm_medium=lp&amp;utm_campaign=X2-r1&amp;utm_content=cta_mall" target="_blank" rel="noopener">育兒便利店看完整商品</a>
            </div>
          </div>
        </div>
      </section>
      <nav class="pager" aria-label="ページめくり" hidden>
        <button class="previous-page" type="button" aria-label="前のページへ">‹</button>
        <button class="next-page" type="button" aria-label="次のページへ">›</button>
      </nav>
    </main>
    <script>
      const pages = [...document.querySelectorAll('.lp-page')];
      const lp = document.querySelector('main');
      const pager = document.querySelector('.pager');
      const previousButton = document.querySelector('.previous-page');
      const nextButton = document.querySelector('.next-page');
      const p4TextBlock = document.querySelector('.p4-text-block');
      const p4Ctas = document.querySelector('.p4-ctas');
      let currentPage = 0;
      let p4CtaTimer;

      function updatePager() {
        pager.hidden = currentPage === 0;
        nextButton.hidden = currentPage === pages.length - 1 && p4TextBlock.classList.contains('is-cta-visible');
      }

      function resetP4Ctas() {
        window.clearTimeout(p4CtaTimer);
        p4TextBlock.classList.remove('is-cta-visible');
        if (currentPage === pages.length - 1) {
          p4CtaTimer = window.setTimeout(() => {
            p4TextBlock.classList.add('is-cta-visible');
            updatePager();
          }, 5000);
        }
      }

      function showPage(pageIndex) {
        if (pageIndex < 0 || pageIndex >= pages.length || pageIndex === currentPage) return;
        pages[currentPage].classList.remove('is-active');
        currentPage = pageIndex;
        pages[currentPage].classList.add('is-active');
        resetP4Ctas();
        updatePager();
      }

      function showNextPage() {
        if (currentPage === pages.length - 1 && !p4TextBlock.classList.contains('is-cta-visible')) {
          window.clearTimeout(p4CtaTimer);
          p4TextBlock.classList.add('is-cta-visible');
          updatePager();
          return;
        }
        showPage(currentPage + 1);
      }

      function showPreviousPage() {
        showPage(currentPage - 1);
      }

      lp.addEventListener('click', showNextPage);
      previousButton.addEventListener('click', (event) => {
        event.stopPropagation();
        showPreviousPage();
      });
      nextButton.addEventListener('click', (event) => {
        event.stopPropagation();
        showNextPage();
      });
      p4Ctas.addEventListener('click', (event) => event.stopPropagation());
      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          showPreviousPage();
        }
        if (event.key === 'Enter' || event.key === 'ArrowRight' || event.key === ' ') {
          event.preventDefault();
          showNextPage();
        }
      });
    </script>
  </body>
</html>
